<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casa das Cores - Tintas e Acabamentos</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />


  <style>
    /* CSS Variables for Theme Customization - CASA DAS CORES */
    :root {
      --color-header-bg: #1a2351;
      --color-header-text: #ffffff;
      --color-accent: #f26522;
      --color-background: #f0f4f8;
      --color-card-bg: #ffffff;
      --color-card-text: #1e293b;
      --color-button-primary: #f26522;
      --color-button-text: #ffffff;
      --color-text-primary: #0f172a;
      --color-text-secondary: #64748b;

      /* Modern Additions - Inova Tintas */
      --gradient-primary: linear-gradient(135deg, #f26522 0%, #ff8844 100%);
      --gradient-secondary: linear-gradient(135deg, #1a2351 0%, #263074 100%);
      --gradient-hero: linear-gradient(135deg, rgba(26, 35, 81, 0.08) 0%, rgba(242, 101, 34, 0.08) 100%);
      --gradient-glass: linear-gradient(145deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.6) 100%);

      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 12px 24px rgba(0, 0, 0, 0.08);
      --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.12);
      --shadow-premium: 0 15px 35px -5px rgba(0, 0, 0, 0.1), 0 8px 15px -6px rgba(0, 0, 0, 0.1);

      --blur-glass: blur(16px);
    }

    /* Smooth Scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Hide scrollbar for horizontal scrolling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body {
      background: linear-gradient(180deg, #e8edf5 0%, #f0f4f8 100%);
      min-height: 100vh;
    }

    /* Glassmorphism Utility */
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: var(--blur-glass);
      -webkit-backdrop-filter: var(--blur-glass);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .glass-dark {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: var(--blur-glass);
      -webkit-backdrop-filter: var(--blur-glass);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Hover Animations */
    .hover-lift {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .hover-scale {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hover-scale:hover {
      transform: scale(1.05);
    }

    /* Gradient Text */
    .gradient-text {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
